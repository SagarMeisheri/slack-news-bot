[project]
name = "spec-agents"
version = "0.2.0"
description = "Real-Time News Intelligence & Scenario Analysis Multi-Agent Streamlit App with Google ADK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "google-adk>=2.7.0",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "schemas", "tools", "ui"]
